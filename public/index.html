<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Drama Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4F0; --surface:#FFFFFF; --sunken:#EFEDE7; --ink:#17191B; --ink-2:#3B3F42; --muted:#6E7275; --line:#E3E0D8; --line-2:#D3CFC4;
  --accent:#0E5B57; --accent-ink:#FFFFFF; --accent-soft:#E2EFEC;
  --ok:#2E7A4C; --ok-soft:#E4F1E8; --warn:#A86A12; --warn-soft:#FBF0DC; --bad:#B4322A; --bad-soft:#FBE7E4;
  --r:10px; --r-sm:7px;
  --font:"Schibsted Grotesk", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --side:264px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;font-weight:700;letter-spacing:-.01em}
a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.side-head{padding:20px 18px 14px;border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:17px;display:flex;align-items:center;gap:9px}
.logo svg{flex:none}
.side-body{flex:1;overflow:auto;padding:12px 10px 16px}
.side-foot{border-top:1px solid var(--line);padding:14px 16px;display:grid;gap:8px}
.topbar{display:none}
main{min-width:0;padding:28px clamp(16px,3vw,48px) 72px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap;min-height:38px}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#0A4744}
.btn.danger{color:var(--bad)}
.btn.stop{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;min-height:32px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:none;padding:6px;border-radius:var(--r-sm);cursor:pointer;color:var(--muted);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline;text-underline-offset:2px}

/* ---------- Sidebar content ---------- */
.side-new{width:100%;margin-bottom:10px}
.ser{padding:10px 8px 6px;border-radius:var(--r)}
.ser+.ser{border-top:1px solid var(--line);border-radius:0}
.ser-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ser-title{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ser-meta{font-size:12.5px;color:var(--muted);margin:2px 0 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ser-meta .missing{color:var(--bad)}
.queue{margin-top:14px;border-top:1px solid var(--line,#e5e5e5);padding-top:10px}
.queue h3{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
.queue ol{margin:0;padding-left:18px;font-size:13px;display:grid;gap:4px}
.queue li span{color:var(--muted)}
.ep{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:var(--r-sm);cursor:pointer;color:var(--ink-2);font-size:14px}
.ep:hover{background:var(--sunken)}
.ep[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ep span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ep-add{font-size:13px;color:var(--muted);padding:5px 8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);flex:none}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--warn)}.dot.bad{background:var(--bad)}
.field-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.acct{display:flex;gap:6px}
.acct select{flex:1;min-width:0}

/* ---------- Forms ---------- */
label{display:block;font-weight:600;font-size:13.5px;margin:14px 0 6px}
.hint{color:var(--muted);font-size:13.5px}
input[type=text],textarea,select{width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 10px;background:var(--surface)}
select{padding:7px 8px}
textarea{resize:vertical;min-height:56px}
input[type=file]{font-size:13.5px}

/* ---------- Episode header ---------- */
.crumb{font-size:13.5px;color:var(--muted);margin-bottom:4px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:clamp(22px,2.6vw,30px);outline:none;border-radius:4px}
.head h1:focus{box-shadow:0 0 0 2px var(--accent-soft)}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(23,25,27,.12);padding:6px;min-width:260px;z-index:20;display:none}
.menu.open .menu-list{display:block}
.menu-list button,.menu-list a{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:14px;color:var(--ink);text-decoration:none}
.menu-list button:hover,.menu-list a:hover{background:var(--sunken)}
.menu-list hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.menu-list .danger{color:var(--bad)}

/* ---------- Progress ---------- */
.progress{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:22px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;list-style:none;margin:0;padding:0}
.step{display:grid;gap:7px;font-size:13px;color:var(--muted)}
.step .bar{height:4px;border-radius:2px;background:var(--sunken)}
.step.done .bar{background:var(--accent)}
.step.now .bar{background:var(--warn);position:relative;overflow:hidden}
.step.now .bar::after{content:"";position:absolute;inset:0;width:40%;background:rgba(255,255,255,.55);animation:slide 1.4s ease-in-out infinite}
.step.bad .bar{background:var(--bad)}
.step.done,.step.now,.step.bad{color:var(--ink)}
.step b{font-weight:600}
.step small{display:block;color:var(--muted);font-size:12px}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.status-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:14px}
.status-line .msg{flex:1;min-width:200px}
.status-line.bad .msg{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.busy{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* ---------- Body ---------- */
.grid{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:28px;align-items:start}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-title h2{font-size:17px}
.final{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:sticky;top:20px}
.final video,.final .ph{width:100%;aspect-ratio:9/16;border-radius:var(--r-sm);background:#0E1011;display:block}
.final .ph{display:grid;place-items:center;text-align:center;color:#9AA0A3;font-size:13.5px;padding:20px}
.final .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}

.scenes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card .media{position:relative;aspect-ratio:9/16;background:#0E1011}
.card video{width:100%;height:100%;object-fit:cover;display:block;background:#0E1011}
.card .sb{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:10px;padding:16px 12px;color:#E6E9EA;font-size:13px;text-align:center}
.card .sb span{line-height:1.45;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.card .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.35) brightness(.45)}
.card .tag{position:absolute;left:8px;top:8px;background:rgba(14,16,17,.78);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;pointer-events:none}
.card .body{padding:10px 12px 12px;display:grid;gap:6px}
.card .title{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.spin{width:22px;height:22px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:rot .9s linear infinite;margin:0 auto}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin,.step.now .bar::after{animation:none}}

.extras{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
details.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.box>summary{cursor:pointer;padding:13px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:.15s}
details.box[open]>summary::after{transform:rotate(-135deg)}
details.box .inner{padding:0 16px 16px}
.console{background:#141618;color:#CBD2D4;border-radius:var(--r-sm);padding:12px 14px;font:12.5px/1.55 var(--mono);height:280px;overflow:auto;white-space:pre-wrap;margin:0}
.drop{display:block;border:1.5px dashed var(--line-2);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface);margin-bottom:22px}
.drop strong{color:var(--ink);display:block;margin-bottom:4px}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent)}

/* ---------- Empty ---------- */
.empty{max-width:560px;margin:14vh auto 0;text-align:left}
.empty h1{font-size:clamp(26px,3.4vw,36px);margin-bottom:12px}
.empty ol{color:var(--ink-2);padding-left:20px;margin:16px 0 22px}
.empty li{margin:4px 0}

/* ---------- Dialog ---------- */
dialog{border:0;border-radius:14px;padding:0;width:min(760px,94vw);max-height:90vh;color:var(--ink)}
dialog::backdrop{background:rgba(23,25,27,.5)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-head h2{font-size:18px}
.dlg-body{padding:6px 22px 22px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.detail-top{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;margin-top:16px}
.detail-top video,.detail-top .ph{width:100%;aspect-ratio:9/16;border-radius:var(--r-sm);background:#0E1011;display:block}
.detail-top .ph{display:grid;place-items:center;color:#9AA0A3;font-size:13px;text-align:center;padding:14px}
.shot{display:grid;grid-template-columns:22px 1fr 1fr;gap:8px;align-items:start;margin-top:8px}
.shot>span{font-weight:700;color:var(--muted);padding-top:8px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
pre.prompt{white-space:pre-wrap;background:var(--sunken);border-radius:var(--r-sm);padding:12px;font:12.5px/1.5 var(--mono);max-height:300px;overflow:auto;margin:8px 0 0}
details.sub{border-top:1px solid var(--line);margin-top:18px;padding-top:12px}
details.sub summary{cursor:pointer;font-weight:600}
.attempt{border-top:1px solid var(--line);padding:8px 0;font-size:13.5px}
.attempt:first-child{border-top:0}
.ok-t{color:var(--ok);font-weight:600}.bad-t{color:var(--bad);font-weight:600}
.vo{background:var(--warn-soft);border-radius:var(--r-sm);padding:8px 12px;font-size:13.5px;margin-top:10px}
.levels{display:grid;gap:2px;margin:12px 0}
.lvl{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:14px;padding:7px 8px;border-radius:var(--r-sm)}
.lvl em{font-style:normal;color:var(--muted);display:block;font-size:13px}
.lvl b{color:var(--accent)}

.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,8px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:var(--r-sm);opacity:0;transition:.2s;pointer-events:none;max-width:min(460px,92vw);z-index:50;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--bad)}
.scrim{display:none}

/* ---------- Responsive ---------- */
@media (min-width:1640px){.scenes{grid-template-columns:repeat(6,minmax(0,1fr))}.grid{grid-template-columns:minmax(280px,340px) minmax(0,1fr)}}
@media (max-width:1180px){.scenes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:960px){
  .grid{grid-template-columns:1fr}
  .final{position:static;display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:16px;align-items:start}
  .final .meta{margin-top:0;flex-direction:column;align-items:flex-start}
  .scenes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .extras{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);z-index:40;transform:translateX(-100%);transition:transform .2s ease}
  body.nav-open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.2)}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(23,25,27,.4);z-index:30}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px}
  .topbar .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{padding-top:18px}
}
@media (max-width:640px){
  .steps{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
  .step small{display:none}
  .step b{font-size:11.5px}
  .scenes{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .final{grid-template-columns:1fr}
  .final video,.final .ph{max-width:300px;margin:0 auto}
  .head-actions{width:100%}
  .head-actions .btn.primary,.head-actions .btn.stop{flex:1}
  .detail-top{grid-template-columns:1fr}
  .detail-top video,.detail-top .ph{max-width:240px}
  .shot{grid-template-columns:18px 1fr}
  .shot textarea[data-d]{grid-column:2}
  .dlg-head,.dlg-body,.dlg-foot{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Serial dan episode">
    <div class="side-head">
      <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg>Flow Drama Studio</div>
    </div>
    <div class="side-body">
      <button class="btn primary side-new" id="newSeries">Serial baru</button>
      <div id="seriesList"></div>
      <div id="queueBox"></div>
    </div>
    <div class="side-foot">
      <span class="field-label" id="acctLbl">Akun Google aktif (untuk login)</span>
      <div class="acct"><select id="acct" aria-labelledby="acctLbl"></select><button class="btn sm" id="addAcct" title="Tambah akun Google">Tambah</button></div>
      <button class="btn sm" id="openFlow">Buka Google Flow</button>
      <button class="link" id="showRules" style="justify-self:start;font-size:13px">Cara kerja perbaikan prompt</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div style="min-width:0">
    <div class="topbar">
      <button class="icon-btn" id="navBtn" aria-label="Buka menu serial"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <span class="t" id="topTitle">Flow Drama Studio</span>
    </div>
    <main id="main"></main>
  </div>
</div>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const api = async (url, opt = {}) => {
  const fd = opt.body instanceof FormData;
  const r = await fetch(url, { headers: fd ? {} : { 'Content-Type': 'application/json' }, ...opt, body: fd ? opt.body : (opt.body ? JSON.stringify(opt.body) : undefined) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const toast = (msg, err) => { const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 3800); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dlg = $('#dlg');

let S = { series: [], episodes: [], runner: {} }, rules = null, sel = { ep: null }, logTimer = null, lastSig = '';

async function load() {
  S = await api('/api/state');
  if (!rules) rules = await api('/api/rules');
  if (sel.ep && !S.episodes.some(e => e.id === sel.ep)) sel.ep = null;
  renderSide(); renderMain();
}

// ---------- Status helpers ----------
const BUSY = ['waiting', 'cropping', 'prompting', 'generating', 'downloading', 'merging'];
function sceneState(sc) {
  if (sc.clip) return { cls: 'ok', text: 'Video siap' };
  if (sc.flowName) return { cls: 'busy', text: 'Jadi, menunggu unduh' };
  if (sc.status === 'running') return { cls: 'busy', text: 'Sedang dibuat' };
  if (sc.status === 'queued') return { cls: '', text: 'Antre' };
  if (sc.status === 'failed' || sc.status === 'manual') return { cls: 'bad', text: 'Perlu dicek' };
  return { cls: '', text: 'Belum dibuat' };
}
function epState(ep) {
  const st = ep.pipeline && ep.pipeline.stage;
  if (ep.output && (!st || st === 'done')) return { cls: 'ok', text: 'Selesai' };
  if (BUSY.includes(st)) return { cls: 'busy', text: 'Berjalan' };
  if (st === 'attention' || st === 'error') return { cls: 'bad', text: 'Perlu dicek' };
  return { cls: '', text: 'Belum mulai' };
}
const STEPS = [
  ['cropping', 'Potong', 'storyboard jadi 6 scene'],
  ['prompting', 'Prompt', 'Claude menulis isi scene'],
  ['generating', 'Generate', 'video di Google Flow'],
  ['downloading', 'Unduh', 'video dari Flow'],
  ['merging', 'Gabung', 'jadi satu episode'],
];
function stepIndex(ep) {
  const st = ep.pipeline && ep.pipeline.stage;
  const i = STEPS.findIndex(s => s[0] === st);
  if (i >= 0) return i;
  if (st === 'done' || ep.output) return 5;
  if (st === 'waiting') return 0;
  // attention / error / belum mulai: tebak dari data
  if (!ep.scenes.every(s => s.startFrame)) return 0;
  if (!ep.scenes.every(s => s.customPrompt || s.shots.some(x => x.action))) return 1;
  if (!ep.scenes.every(s => s.clip || s.flowName)) return 2;
  if (!ep.scenes.every(s => s.clip)) return 3;
  return 4;
}

const accName = id => ((S.accounts || []).find(a => a.id === id) || {}).name || 'akun aktif';

// ---------- Sidebar ----------
function renderQueue() {
  const q = (S.queue || []).map(id => S.episodes.find(e => e.id === id)).filter(Boolean);
  $('#queueBox').innerHTML = q.length ? `<div class="queue"><h3>Antrean (${q.length})</h3><ol>${q.map(e => {
    const s = S.series.find(x => x.id === e.seriesId) || {};
    return `<li>${esc(s.title || '')} · ${esc(shortTitle(e, s))} <span>(${esc(accName(s.accountId))})</span></li>`;
  }).join('')}</ol></div>` : '';
}
function renderSide() {
  renderQueue();
  $('#seriesList').innerHTML = S.series.map(s => {
    const eps = S.episodes.filter(e => e.seriesId === s.id);
    return `<div class="ser">
      <div class="ser-head"><span class="ser-title" title="${esc(s.title)}">${esc(s.title)}</span>
        <button class="icon-btn" data-edit-series="${s.id}" aria-label="Pengaturan serial ${esc(s.title)}" title="Pengaturan serial"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg></button></div>
      <div class="ser-meta">Akun: ${esc(accName(s.accountId))}</div>
      <div class="ser-meta">${s.characterSheet ? `Sheet tokoh <a href="/files/${esc(s.characterSheet)}" target="_blank" rel="noopener">lihat</a>` : `<span class="missing">Belum ada sheet tokoh</span> <button class="link" data-sheet="${s.id}">unggah</button>`}</div>
      ${eps.map(e => { const st = epState(e); return `<button class="ep" data-ep="${e.id}" aria-current="${sel.ep === e.id}"><i class="dot ${st.cls}" aria-hidden="true"></i><span>${esc(shortTitle(e, s))}</span></button>`; }).join('')}
      <button class="ep ep-add" data-new-ep="${s.id}">+ Episode baru</button>
    </div>`;
  }).join('') || '<p class="hint" style="padding:8px">Belum ada serial.</p>';
}
const shortTitle = (e, s) => s && e.title.toLowerCase().startsWith(s.title.toLowerCase()) ? e.title.slice(s.title.length).replace(/^[\s–—:-]+/, '') || e.title : e.title;

$('#seriesList').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.ep) { sel.ep = b.dataset.ep; lastSig = ''; renderSide(); renderMain(); closeNav(); window.scrollTo(0, 0); }
  if (b.dataset.newEp) newEpisode(b.dataset.newEp);
  if (b.dataset.editSeries) editSeries(b.dataset.editSeries);
  if (b.dataset.sheet) pickSheet(b.dataset.sheet);
});
$('#newSeries').onclick = () => { closeNav(); editSeries(null); };
const closeNav = () => document.body.classList.remove('nav-open');
$('#navBtn').onclick = () => document.body.classList.add('nav-open');
$('#scrim').onclick = closeNav;
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeNav(); $$('.menu.open').forEach(m => m.classList.remove('open')); } });

async function loadAccounts() {

}

$('#showRules').onclick = () => {

function openDialog(title, body, foot = '') {
  dlg.innerHTML = `<div class="dlg-head"><h2>${title}</h2><button class="icon-btn" data-close aria-label="Tutup"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
    <div class="dlg-body">${body}</div>${foot ? `<div class="dlg-foot">${foot}</div>` : ''}`;
  dlg.showModal();
}
dlg.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target === dlg) dlg.close(); });

async function uploadSheet(seriesId, file) { const fd = new FormData(); fd.append('file', file); return api(`/api/series/${seriesId}/character-sheet`, { method: 'POST', body: fd }); }
function pickSheet(seriesId) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => { if (!inp.files[0]) return; try { await uploadSheet(seriesId, inp.files[0]); toast('Sheet tokoh tersimpan'); load(); } catch (e) { toast(e.message, 1); } };
  inp.click();
}

async function editSeries(id) {
  const s = id ? S.series.find(x => x.id === id) : { title: '', characters: [] };
  const acc = await api('/api/accounts').catch(() => ({ accounts: [], active: null }));
  const curAcc = s.accountId || acc.active;
  const txt = s.characters.map(c => `${c.key} | ${c.role} | ${c.look}`).join('\n');
  openDialog(id ? 'Pengaturan serial' : 'Serial baru', `
    <label for="stitle">Judul serial</label><input type="text" id="stitle" value="${esc(s.title)}" placeholder="Pelakor Berkedok Sahabat">
    <label for="sacc">Akun Google untuk drama ini</label>
    <select id="sacc">${acc.accounts.map(a => `<option value="${a.id}" ${a.id === curAcc ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
    <p class="hint">Semua episode drama ini dibuat dan diunduh di akun ini. Kalau drama lain memakai akun berbeda, antrean pindah akun sendiri. Tambah akun baru di bagian bawah menu samping.</p>
    <label for="ssheet">Sheet tokoh</label><input type="file" id="ssheet" accept="image/*">
    <p class="hint">${s.characterSheet ? 'Sudah ada. Pilih file hanya kalau mau mengganti.' : 'Satu gambar berisi semua tokoh. Dipakai sebagai referensi ke-2 di setiap scene supaya wajah dan baju konsisten.'}</p>
    <label for="ssb">${id ? 'Storyboard episode berikutnya' : 'Storyboard episode'}</label><input type="file" id="ssb" accept="image/*" multiple>
    <p class="hint">Boleh pilih banyak sekaligus: tiap gambar jadi satu episode, diurutkan berdasarkan nama file (mis. eps1.png, eps2.png…), lalu diproses bergiliran di antrean sampai jadi.</p>
    <details class="sub"><summary>Tokoh (opsional, diisi Claude dari storyboard)</summary>
      <label for="schars">Satu per baris: kode | peran | penampilan</label>
      <textarea id="schars" rows="6" placeholder="R | The wife | Indonesian woman, 32, sage green hijab, cream blouse">${esc(txt)}</textarea>
      <p class="hint">Tulis peran dalam bahasa Inggris tanpa nama, supaya nama tidak muncul sebagai teks di video.</p>
    </details>`,
    `${id ? '<button class="btn danger" id="delS" style="margin-right:auto">Hapus serial</button>' : ''}<button class="btn" data-close>Batal</button><button class="btn primary" id="saveS">${id ? 'Simpan' : 'Buat serial'}</button>`);
  $('#saveS').onclick = async () => {
    const characters = $('#schars').value.split('\n').map(l => l.split('|').map(x => x.trim())).filter(p => p.length >= 3 && p[0]).map(([key, role, ...look]) => ({ key, role, look: look.join(' | ') }));
    const body = { title: $('#stitle').value.trim() || 'Serial baru', characters, accountId: $('#sacc').value || undefined };
    const files = [...$('#ssb').files].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true })), sheet = $('#ssheet').files[0];
    $('#saveS').disabled = true;
    try {
      const sv = await api(id ? `/api/series/${id}` : '/api/series', { method: id ? 'PUT' : 'POST', body });
      if (sheet) await uploadSheet(sv.id, sheet);
      let first = null;
      for (const f of files) {
        const fd = new FormData(); fd.append('file', f);
        const ep = await api(`/api/series/${sv.id}/storyboard`, { method: 'POST', body: fd });
        first = first || ep;
      }
      if (first) { sel.ep = first.id; toast(files.length > 1 ? `${files.length} episode masuk antrean.` : 'Storyboard diunggah. Episode diproses otomatis.'); }
      else toast('Serial tersimpan');
      dlg.close(); load();
    } catch (e) { toast(e.message, 1); $('#saveS').disabled = false; }
  };
  if (id) $('#delS').onclick = async () => { if (!confirm('Hapus serial ini beserta semua episodenya?')) return; await api(`/api/series/${id}`, { method: 'DELETE' }); dlg.close(); sel.ep = null; load(); };
}

async function newEpisode(seriesId) {
  const n = S.episodes.filter(e => e.seriesId === seriesId).length + 1;
  const ep = await api('/api/episodes', { method: 'POST', body: { seriesId, title: `Episode ${n}`, sceneCount: 6 } });
  sel.ep = ep.id; closeNav(); await load();
}

  const m = $('#main');
  $('#topTitle').textContent = ep ? ep.title : 'Flow Drama Studio';
  if (!ep) {
    m.innerHTML = `<div class="empty"><h1>Dari storyboard ke episode jadi.</h1>
      <p class="hint" style="font-size:15px">Kamu cukup menyiapkan dua gambar. Sisanya dikerjakan otomatis:</p>
      <ol><li>Storyboard dipotong jadi 6 scene.</li><li>Claude menulis prompt tiap scene.</li><li>Google Flow membuat videonya, memakai sheet tokoh sebagai referensi.</li><li>Video diunduh lalu digabung jadi satu episode.</li></ol>
      <button class="btn primary" onclick="document.getElementById('newSeries').click()">Buat serial</button></div>`;
    pollLog(); return;
  }
  const series = S.series.find(s => s.id === ep.seriesId) || { title: '' };

  const clips = ep.scenes.filter(s => s.clip).length;

  else if (ep.output && st !== 'attention' && st !== 'error') primary = `<a class="btn primary" href="/files/${ep.output.file}" download>Unduh episode</a>`;
  else if (st === 'attention' || st === 'error') primary = `<button class="btn primary" id="autoResume">Lanjutkan</button>`;
  else if (!busy && ep.storyboard) primary = `<button class="btn primary" id="autoResume">Mulai otomatis</button>`;

  if (st === 'waiting' && qPos >= 0) primary = `<span class="hint">Antrean ke-${qPos + 1}</span><button class="btn" id="unqueue">Keluarkan dari antrean</button>`;

  m.innerHTML = `
    <div class="head">
      <div style="min-width:0;flex:1">
        <div class="crumb">${esc(series.title)}</div>
        <h1 contenteditable="true" spellcheck="false" id="epTitle" title="Klik untuk mengganti judul">${esc(shortTitle(ep, series))}</h1>
      </div>
      <div class="head-actions">
        ${primary}
        <div class="menu" id="epMenu"><button class="btn" id="menuBtn" aria-haspopup="true" aria-expanded="false">Lainnya</button>
          <div class="menu-list" role="menu">
            ${ep.flowProjectUrl ? `<a role="menuitem" href="${esc(ep.flowProjectUrl)}" target="_blank" rel="noopener">Buka project Flow di tab baru</a><button role="menuitem" data-open-ep-proj="${ep.id}">Buka di browser otomasi</button><hr>` : ''}
            <button role="menuitem" id="mGen" ${running || !ep.scenes.some(s => s.startFrame) ? 'disabled' : ''}>Generate scene yang belum jadi</button>
            <button role="menuitem" id="mMerge" ${clips === ep.scenes.length ? '' : 'disabled'}>Gabung ulang episode</button>
            <label role="menuitem" class="sr-label" style="display:block;margin:0;padding:8px 10px;font-weight:400;font-size:14px;cursor:pointer;border-radius:7px" for="sbFile2">Ganti storyboard<input type="file" id="sbFile2" accept="image/*" class="sr"></label>
            <hr><button role="menuitem" class="danger" id="mDel">Hapus episode</button>

      </div>

    ${ep.storyboard ? progressBox(ep) : `<label class="drop" id="sbDrop" for="sbFile"><strong>Unggah gambar storyboard</strong>Format storyboard 6 scene. Begitu diunggah, episode langsung diproses otomatis.<input type="file" id="sbFile" accept="image/*" class="sr"></label>`}

          : `<div class="ph">Episode muncul di sini setelah ke-${ep.scenes.length} video scene jadi dan digabung.</div>

function progressBox(ep) {
  const st = ep.pipeline && ep.pipeline.stage;
  const idx = stepIndex(ep);
  const bad = st === 'attention' || st === 'error';
  const busy = BUSY.includes(st);
  const counts = { generating: `${ep.scenes.filter(s => s.flowName || s.clip).length}/${ep.scenes.length}`, downloading: `${ep.scenes.filter(s => s.clip).length}/${ep.scenes.length}` };
  const steps = STEPS.map(([k, name, sub], i) => {
    const cls = i < idx ? 'done' : i === idx ? (bad ? 'bad' : busy ? 'now' : '') : '';
    return `<li class="step ${cls}"><span class="bar"></span><span><b>${name}</b>${counts[k] && i === idx ? ` <span class="hint">${counts[k]}</span>` : ''}<small>${sub}</small></span></li>`;
  }).join('');
  let msg = '';
  if (st === 'done' || (ep.output && !st)) msg = 'Episode selesai dan siap diunduh.';
  else if (st === 'waiting') msg = 'Menunggu giliran: episode lain sedang diproses.';
  else if (busy) msg = { cropping: 'Memotong storyboard…', prompting: 'Claude membaca storyboard dan menulis prompt…', generating: 'Google Flow sedang membuat video. Satu scene ±3–8 menit. Jangan tutup jendela Chrome otomasi.', downloading: 'Mengunduh video dari Flow berdasarkan nama scene…', merging: 'Menggabungkan semua scene…' }[st];
  else if (bad) {
    const err = ep.pipeline.error || '';
    const miss = ep.scenes.filter(s => !s.clip).map(s => s.n);
    msg = err && !/belum punya video/.test(err) ? err
      : miss.length ? `Scene ${miss.join(', ')} belum punya video. Klik Lanjutkan untuk mencoba lagi, atau unggah videonya lewat Detail.`
      : 'Semua video sudah ada. Klik Lanjutkan untuk menggabungkan.';
  }
  else msg = 'Belum dijalankan. Klik Mulai otomatis.';
  return `<div class="progress" role="status"><ol class="steps">${steps}</ol>
    <div class="status-line ${bad ? 'bad' : ''}"><span class="msg">${esc(msg)}</span></div></div>`;
}

function sceneCard(sc) {
  const s = sceneState(sc);
  let media;
  if (sc.clip) media = `<video src="/files/${sc.clip}#t=0.6" controls preload="metadata" playsinline aria-label="Video scene ${sc.n}"></video>`;
  else {
    const cover = sc.singleFrame || sc.startFrame;
    const note = sc.status === 'running' ? '<div class="spin" aria-hidden="true"></div><span>Sedang dibuat di Flow</span>'
      : sc.flowName ? '<span>Sudah jadi di Flow.<br>Diunduh setelah semua scene selesai.</span>'
      : cover ? '<span>Belum ada video.<br>Gambar dari storyboard.</span>' : '<span>Belum ada storyboard</span>';
    media = `${cover ? `<img class="cover" src="/files/${cover}" alt="" loading="lazy">` : ''}<div class="sb">${note}</div>`;
  }
  return `<article class="card" aria-label="Scene ${sc.n}">
    <div class="media">${media}<span class="tag">Scene ${sc.n}</span></div>
    <div class="body">
      <div class="title" title="${esc(sc.title)}">${esc(sc.title)}</div>
      <div class="row"><span class="pill ${s.cls}">${s.text}</span><button class="btn sm" data-detail="${sc.n}">Detail</button></div>
    </div></article>`;
}
const sig = ep => JSON.stringify([(S.queue || []).indexOf(ep.id), ep.pipeline && ep.pipeline.stage, ep.output && ep.output.at, ep.scenes.map(s => [s.status, !!s.clip, !!s.flowName, s.startFrame, s.title])]);

function bindMain(ep) {
  const t = $('#epTitle');
  t.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); t.blur(); } };
  t.onblur = () => { const v = t.textContent.trim(); if (v && v !== shortTitle(ep, S.series.find(s => s.id === ep.seriesId))) api(`/api/episodes/${ep.id}`, { method: 'PUT', body: { title: v } }).then(load); };
  const menu = $('#epMenu');
  $('#menuBtn').onclick = e => { e.stopPropagation(); menu.classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded', menu.classList.contains('open')); };
  document.onclick = e => { if (!e.target.closest('#epMenu')) menu.classList.remove('open'); };
  const up = async file => { const fd = new FormData(); fd.append('file', file); toast('Mengunggah storyboard…'); try { await api(`/api/episodes/${ep.id}/storyboard`, { method: 'POST', body: fd }); toast('Storyboard dipotong. Episode diproses otomatis.'); load(); } catch (e) { toast(e.message, 1); } };
  ['sbFile', 'sbFile2'].forEach(id => { const el = document.getElementById(id); if (el) el.onchange = () => { menu.classList.remove('open'); el.files[0] && up(el.files[0]); }; });
  const drop = $('#sbDrop');
  if (drop) { drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); }; drop.ondragleave = () => drop.classList.remove('over'); drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && up(e.dataTransfer.files[0]); }; }
  const ar = $('#autoResume'); if (ar) ar.onclick = async () => { ar.disabled = true; try { await api(`/api/episodes/${ep.id}/auto`, { method: 'POST', body: {} }); toast('Alur otomatis berjalan'); load(); } catch (e) { toast(e.message, 1); ar.disabled = false; } };
  const stop = $('#stopBtn'); if (stop) stop.onclick = async () => { await api('/api/stop', { method: 'POST' }); toast('Berhenti setelah langkah ini selesai. Episode lain di antrean dikeluarkan.'); load(); };
  const unq = $('#unqueue'); if (unq) unq.onclick = async () => { try { await api(`/api/queue/${ep.id}`, { method: 'DELETE' }); toast('Dikeluarkan dari antrean'); load(); } catch (e) { toast(e.message, 1); } };
  $('#mGen').onclick = async () => { menu.classList.remove('open'); try { await api(`/api/episodes/${ep.id}/auto`, { method: 'POST', body: {} }); toast('Scene yang belum jadi diproses'); load(); } catch (e) { toast(e.message, 1); } };
  $('#mMerge').onclick = async () => { menu.classList.remove('open'); toast('Menggabungkan video…'); try { await api(`/api/episodes/${ep.id}/merge`, { method: 'POST' }); toast('Episode digabung ulang'); load(); } catch (e) { toast(e.message, 1); } };
  $('#mDel').onclick = async () => { if (!confirm('Hapus episode ini?')) return; await api(`/api/episodes/${ep.id}`, { method: 'DELETE' }); sel.ep = null; load(); };
  $('#scenes').onclick = e => { const b = e.target.closest('[data-detail]'); if (b) openScene(ep, +b.dataset.detail); };
}

// ---------- Scene detail ----------
async function openScene(ep, n) {
  const sc = ep.scenes.find(s => s.n === n); if (!sc) return;
  const series = S.series.find(s => s.id === ep.seriesId);
  const preview = await api(`/api/episodes/${ep.id}/scenes/${n}/prompt`).catch(e => ({ prompt: e.message }));
  const s = sceneState(sc);
  openDialog(`Scene ${n} · ${esc(sc.title)}`, `
    <div class="detail-top">
      <div>${sc.clip ? `<video src="/files/${sc.clip}?t=${Date.now()}" controls playsinline preload="metadata"></video>` : `<div class="ph">${s.text}</div>`}
        <label class="btn sm" for="clipFile" style="margin-top:10px;width:100%">${sc.clip ? 'Ganti video' : 'Unggah video manual'}<input type="file" id="clipFile" accept="video/*" class="sr"></label>
        ${sc.needsVO && sc.needsVO.length ? `<div class="vo">Dialog yang perlu VO: ${sc.needsVO.map(v => `shot ${v.shot} "${esc(v.line)}"`).join(', ')}</div>` : ''}
      </div>
      <div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pill ${s.cls}">${s.text}</span>${sc.attempts.length ? `<span class="hint">${sc.attempts.length} percobaan</span>` : ''}${sc.flowName ? `<span class="hint">Di Flow: “${esc(sc.flowName)}”</span>` : ''}</div>
        ${sc.startFrame ? `<p class="hint" style="margin:12px 0 6px">Frame storyboard</p><img src="/files/${sc.startFrame}" alt="Storyboard scene ${n}" style="width:100%;border-radius:7px">` : ''}
        <label for="ftitle">Judul scene</label><input type="text" id="ftitle" value="${esc(sc.title)}">
      </div>
    </div>

    <details class="sub" open><summary>Isi scene</summary>
      <label for="fset">Setting (bahasa Inggris)</label><textarea id="fset" rows="2">${esc(sc.setting)}</textarea>
      <label>Tokoh di scene ini</label>
      <div class="chips">${series.characters.map(c => `<button type="button" class="chip" data-ch="${esc(c.key)}" aria-pressed="${sc.characters.includes(c.key)}">${esc(c.role.split(',')[0])}</button>`).join('') || '<span class="hint">Belum ada tokoh.</span>'}</div>
      <label>Shot: aksi (Inggris) dan dialog (Indonesia)</label>
      ${sc.shots.map((x, i) => `<div class="shot"><span aria-hidden="true">${i + 1}</span>
        <textarea data-a="${i}" rows="2" aria-label="Aksi shot ${i + 1}">${esc(x.action)}</textarea>
        <textarea data-d="${i}" rows="2" aria-label="Dialog shot ${i + 1}" placeholder="tanpa dialog">${esc(x.dialogue)}</textarea></div>`).join('')}
      <label for="faud">Audio</label><input type="text" id="faud" value="${esc(sc.audio)}">
      <label for="favoid">Tambahan yang dihindari</label><input type="text" id="favoid" value="${esc(sc.avoid || '')}">
    </details>

    <details class="sub"><summary>Prompt yang dikirim ke Flow</summary>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px">
        <select id="lvlSel" style="width:auto" aria-label="Tingkat perbaikan">${rules.ladder.slice(0, 5).map(l => `<option value="${l.level}" ${l.level === (preview.level ?? sc.fixLevel) ? 'selected' : ''}>Tingkat ${l.level}: ${esc(l.name)}</option>`).join('')}</select>
        <button class="btn sm" id="copyPrompt">Salin</button><button class="btn sm" id="setLevel">Jadikan tingkat awal</button>
        <label class="btn sm" for="frameFile" style="margin:0">Ganti frame<input type="file" id="frameFile" accept="image/*" class="sr"></label>
      </div>
      <pre class="prompt" id="promptPre">${esc(preview.prompt)}</pre>
      ${(preview.needsVO || []).length ? `<div class="vo">Dialog yang dibuang di tingkat ini: ${preview.needsVO.map(v => `shot ${v.shot} "${esc(v.line)}"`).join(', ')}</div>` : ''}
      <label for="fcustom">Prompt sendiri (mengabaikan isi scene di atas)</label><textarea id="fcustom" rows="5">${esc(sc.customPrompt)}</textarea>
      <button class="link" id="pasteAll" style="margin-top:8px">Tempel prompt keenam scene sekaligus</button>
    </details>

    <details class="sub"><summary>Riwayat percobaan (${sc.attempts.length})</summary>
      <div style="margin-top:8px">${sc.attempts.length ? sc.attempts.slice().reverse().map(a => `<div class="attempt"><span class="${a.result === 'ok' ? 'ok-t' : 'bad-t'}">${a.result === 'ok' ? 'Berhasil' : 'Gagal'}</span> · tingkat ${a.level} (${esc(a.levelName)}) · ${new Date(a.at).toLocaleString('id-ID')}${a.error ? `<br><span class="hint">${esc(a.error)}</span>` : ''}</div>`).join('') : '<p class="hint">Belum pernah dijalankan.</p>'}</div>
      ${sc.status === 'manual' || sc.status === 'failed' ? `<button class="btn sm" id="resetLvl" style="margin-top:8px">Ulang dari tingkat 0</button>` : ''}
    </details>`,
    `<button class="btn" id="runOne" ${S.runner.running || !sc.startFrame ? 'disabled' : ''} style="margin-right:auto">${sc.clip ? 'Generate ulang' : 'Generate scene ini'}</button><button class="btn" data-close>Tutup</button><button class="btn primary" id="saveScene">Simpan</button>`);

  const box = dlg;
  box.querySelectorAll('.chip').forEach(c => c.onclick = () => c.setAttribute('aria-pressed', c.getAttribute('aria-pressed') !== 'true'));
  const collect = () => ({
    title: $('#ftitle').value, setting: $('#fset').value, audio: $('#faud').value, avoid: $('#favoid').value, customPrompt: $('#fcustom').value,
    characters: [...box.querySelectorAll('.chip[aria-pressed="true"]')].map(c => c.dataset.ch),
    shots: sc.shots.map((_, i) => ({ action: box.querySelector(`[data-a="${i}"]`).value, dialogue: box.querySelector(`[data-d="${i}"]`).value })),
  });
  $('#saveScene').onclick = async () => { await api(`/api/episodes/${ep.id}/scenes/${n}`, { method: 'PUT', body: collect() }); toast(`Scene ${n} tersimpan`); dlg.close(); load(); };
  $('#lvlSel').onchange = async () => { const p = await api(`/api/episodes/${ep.id}/scenes/${n}/prompt?level=${$('#lvlSel').value}`); $('#promptPre').textContent = p.prompt; };
  $('#copyPrompt').onclick = () => { navigator.clipboard.writeText($('#promptPre').textContent); toast('Prompt disalin'); };
  $('#setLevel').onclick = async () => { await api(`/api/episodes/${ep.id}/scenes/${n}`, { method: 'PUT', body: { fixLevel: +$('#lvlSel').value } }); toast('Tingkat awal diubah'); load(); };
  $('#runOne').onclick = async () => {
    if (sc.clip && !confirm('Scene ini sudah punya video. Generate ulang?')) return;
    await api(`/api/episodes/${ep.id}/scenes/${n}`, { method: 'PUT', body: { ...collect(), status: 'draft' } });
    try { await api('/api/run', { method: 'POST', body: { episodeId: ep.id, scenes: [n] } }); toast('Scene masuk antrean'); dlg.close(); setTimeout(load, 800); } catch (e) { toast(e.message, 1); }
  };
  const rl = $('#resetLvl'); if (rl) rl.onclick = async () => { await api(`/api/episodes/${ep.id}/scenes/${n}`, { method: 'PUT', body: { fixLevel: 0, status: 'draft' } }); toast('Tingkat direset'); load(); };
  $('#frameFile').onchange = async e => { const fd = new FormData(); fd.append('file', e.target.files[0]); const which = +$('#lvlSel').value >= 2 ? 'single' : 'row'; await api(`/api/episodes/${ep.id}/scenes/${n}/frame?which=${which}`, { method: 'POST', body: fd }); toast('Frame diganti'); dlg.close(); load(); };
  $('#clipFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; const fd = new FormData(); fd.append('file', f); toast('Mengunggah video…'); try { await api(`/api/episodes/${ep.id}/scenes/${n}/clip`, { method: 'POST', body: fd }); toast(`Video scene ${n} tersimpan`); dlg.close(); load(); } catch (err) { toast(err.message, 1); } };
  $('#pasteAll').onclick = () => {
    openDialog('Tempel prompt keenam scene', `<p class="hint">Format: blok "## SCENE 1: …" atau blok yang masing-masing diawali "Model:". Setiap blok masuk ke scene sesuai urutan.</p><textarea id="bulk" rows="14"></textarea>`,
      `<button class="btn" data-close>Batal</button><button class="btn primary" id="doBulk">Pakai</button>`);
    $('#doBulk').onclick = async () => { const r = await api(`/api/episodes/${ep.id}/paste-prompts`, { method: 'POST', body: { text: $('#bulk').value } }); dlg.close(); toast(`${r.count} prompt dimasukkan`); load(); };
  };
}

// ---------- Polling ----------
function pollLog() {
  clearInterval(logTimer);
  const tick = async () => {
    try {
      const r = await api('/api/log');
      const c = $('#console');
      if (c) { const atBottom = c.scrollTop + c.clientHeight >= c.scrollHeight - 10; c.textContent = r.log.join('\n') || 'Belum ada aktivitas.'; if (atBottom) c.scrollTop = c.scrollHeight; }
      const st = await api('/api/state');
      const runningChanged = st.runner.running !== S.runner.running;
      S = st;
      renderSide();
      const ep = S.episodes.find(e => e.id === sel.ep);
      // Render ulang hanya kalau ada yang berubah, supaya video yang sedang diputar tidak terhenti.
      if (ep && !dlg.open && (runningChanged || sig(ep) !== lastSig)) {
        const playing = $$('video').some(v => !v.paused);
        if (!playing) renderMain();
      }
    } catch {}
  };
  tick(); logTimer = setInterval(tick, 4000);
}

document.addEventListener('click', e => { const b = e.target.closest('[data-open-ep-proj]'); if (b) { api('/api/open-flow', { method: 'POST', body: { episodeId: b.dataset.openEpProj } }).then(() => toast('Project dibuka di browser otomasi')).catch(err => toast(err.message, 1)); } });
loadAccounts().catch(() => {});
load();
</script>
